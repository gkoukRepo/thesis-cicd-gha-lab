# ΠΡΩΤΕΥΟΝ — secrets handling: repository secret (native credential store) + masking στα logs.
# Secret = ΨΕΥΤΙΚΟ (DUMMY-NOT-A-REAL-SECRET-4821, ίδιο σε όλα τα συστήματα). Η μέτρηση γίνεται
# στο log που κατεβάζει το collect (ΟΠΩΣ παρατηρήθηκε — ποτέ υπόθεση).
#   P1 άμεσο echo · P2 base64 (μετασχηματισμένο) · P3 expression interpolation ${{ secrets.X }} μέσα στο script
#   P4 εκτός scope (step χωρίς αντιστοίχιση) · P5 native `::add-mask::` στο παράγωγο (base64) — ειδικό GitHub
name: probe-secrets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  masking:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: P1 direct
        env:
          TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          echo "probe-P1 direct: $TOKEN"
      - name: P2 base64
        env:
          TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          echo "probe-P2 base64: $(printf %s "$TOKEN" | base64)"
      - name: P3 expression interpolation (ΣΚΟΠΙΜΑ — anti-pattern)
        # zizmor/actionlint: ${{ }} μέσα σε run = template injection risk· εδώ στατικό secret, μόνο για παρατήρηση masking
        run: |
          echo "probe-P3 expr: ${{ secrets.DEMO_TOKEN }}"
      - name: P4 out of scope
        run: |
          echo "probe-P4 scope: ${TOKEN:-<not-set>}"
      - name: P5 add-mask on derived value
        env:
          TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          B=$(printf %s "$TOKEN" | base64)
          echo "::add-mask::$B"
          echo "probe-P5 add-mask base64: $B"
